name: Publish release

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/samsung_tv_true_power/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samsung-tv-power-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Python and JSON syntax
        run: |
          python -m compileall -q custom_components scripts tests
          python -c 'import json,pathlib; [json.loads(f.read_text(encoding="utf-8")) for f in pathlib.Path("custom_components").rglob("*.json")]; json.loads(pathlib.Path("hacs.json").read_text(encoding="utf-8"))'
      - name: Check public examples
        run: python scripts/check_public_release.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json;print(json.load(open("custom_components/samsung_tv_true_power/manifest.json",encoding="utf-8"))["version"])')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected Semantic Version MAJOR.MINOR.PATCH, got $VERSION"
            exit 1
          fi
          test -s "releases/${VERSION}.md"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Package and publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to publish."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} exists without a release; resolve manually."
            exit 1
          fi
          mkdir -p dist
          zip -qr "dist/samsung_tv_local_power-${VERSION}.zip" custom_components/samsung_tv_true_power
          gh release create "$TAG" "dist/samsung_tv_local_power-${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "Samsung TV Local Power ${TAG}" \
            --notes-file "releases/${VERSION}.md"
