name: Publish release

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/samsung_tv_true_power/manifest.json'
      - '.github/workflows/release.yml'
      - 'tests/**'
      - 'scripts/check_public_release.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samsung-tv-power-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and version tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Python and JSON syntax
        run: |
          python -m compileall -q custom_components scripts tests
          python -c 'import json,pathlib; [json.loads(f.read_text(encoding="utf-8")) for f in pathlib.Path("custom_components").rglob("*.json")]; json.loads(pathlib.Path("hacs.json").read_text(encoding="utf-8"))'
      - name: Check public examples
        run: python scripts/check_public_release.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json;print(json.load(open("custom_components/samsung_tv_true_power/manifest.json",encoding="utf-8"))["version"])')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected Semantic Version MAJOR.MINOR.PATCH, got $VERSION"
            exit 1
          fi
          test -s "releases/${VERSION}.md"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Package and publish or repair GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          ASSET="samsung_tv_local_power-${VERSION}.zip"
          mkdir -p dist
          ZIP="dist/${ASSET}"
          # The archive must always contain the files at the tagged commit.
          # For an interrupted first publish, use the existing tag to resume.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            SOURCE_REF="$TAG"
          else
            SOURCE_REF="$GITHUB_SHA"
          fi
          git archive --format=zip --output="$ZIP" "$SOURCE_REF" custom_components/samsung_tv_true_power
          test -s "$ZIP"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; verifying ZIP asset."
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET"; then
              gh release upload "$TAG" "$ZIP"
              echo "Recovered missing ZIP asset for ${TAG}."
            fi
          elif [[ "$SOURCE_REF" == "$TAG" ]]; then
            echo "Tag ${TAG} exists but release is missing; resuming publication."
            gh release create "$TAG" "$ZIP" \
              --verify-tag \
              --title "Samsung TV Local Power ${TAG}" \
              --notes-file "releases/${VERSION}.md"
          else
            echo "Creating new version ${TAG}."
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "Samsung TV Local Power ${TAG}" \
              --notes-file "releases/${VERSION}.md"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET"
          echo "::notice::Release ${TAG} contains ${ASSET}."
